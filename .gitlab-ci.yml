stages:
  - discover
  - validate
  - push
  - check-versions

variables:
  TF_INPUT: "0"
  TF_IN_AUTOMATION: "1"
  AUTO_ACTIVATE: "true"
  CODER_ORG: "coder"
  TF_PLAN_CHECK_STRICT: "false"
  PUSH_ALL: "false"

discover_templates:
  stage: discover
  image: alpine/git:2.47.2
  rules:
    - changes:
        - templates/**/*
        - task-runners/**/*
        - ci/discover_templates.py
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        BASE_SHA="$CI_COMMIT_BEFORE_SHA"
      else
        BASE_SHA="$(git rev-parse HEAD~1)"
      fi
      HEAD_SHA="$CI_COMMIT_SHA"
      if [ "$PUSH_ALL" = "true" ]; then
        echo "PUSH_ALL=true set; discovering all templates."
        { find templates -mindepth 1 -maxdepth 1 -type d; find task-runners -mindepth 1 -maxdepth 1 -type d 2>/dev/null; } | sort > changed_templates.txt
      else
        echo "Using diff range: ${BASE_SHA}...${HEAD_SHA}"
        git --no-pager diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
          | awk -F/ '($1 == "templates" || $1 == "task-runners") && $2 != "" { print $1 "/" $2 }' \
          | sort -u > changed_templates_raw.txt
        # Filter out deleted template directories
        while IFS= read -r DIR; do
          [ -d "$DIR" ] && echo "$DIR"
        done < changed_templates_raw.txt > changed_templates.txt
        rm -f changed_templates_raw.txt
      fi

      if [ -s changed_templates.txt ]; then
        printf '{"include":[' > matrix.json
        first=1
        while IFS= read -r TEMPLATE_DIR; do
          [ -z "$TEMPLATE_DIR" ] && continue
          TEMPLATE_NAME="$(sed -n 's/.*"slug"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$TEMPLATE_DIR/metadata.json" 2>/dev/null)"
          [ -z "$TEMPLATE_NAME" ] && TEMPLATE_NAME="$(basename "$TEMPLATE_DIR")"
          if [ "$first" -eq 1 ]; then
            first=0
          else
            printf ',' >> matrix.json
          fi
          printf '{"template":"%s","dir":"%s"}' "$TEMPLATE_NAME" "$TEMPLATE_DIR" >> matrix.json
        done < changed_templates.txt
        printf ']}' >> matrix.json
      else
        echo '{"include":[]}' > matrix.json
      fi

      if [ ! -s changed_templates.txt ]; then
        echo "No template changes detected under templates/ or task-runners/."
      else
        echo "Changed templates:"
        cat changed_templates.txt
      fi
  artifacts:
    when: always
    paths:
      - matrix.json
      - changed_templates.txt
    expire_in: 1 day

validate_templates:
  stage: validate
  image: hashicorp/terraform:1.11
  needs:
    - job: discover_templates
      artifacts: true
  rules:
    - changes:
        - templates/**/*
        - task-runners/**/*
        - ci/discover_templates.py
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      if [ ! -s changed_templates.txt ]; then
        echo "No changed templates to validate."
        exit 0
      fi
      while IFS= read -r TEMPLATE_DIR; do
        [ -z "$TEMPLATE_DIR" ] && continue
        echo "Validating $TEMPLATE_DIR"
        (
          cd "$TEMPLATE_DIR"
          terraform fmt -check
          terraform init -backend=false
          terraform validate
          set +e
          terraform plan -refresh=false -lock=false -input=false -no-color > /tmp/tf-plan.txt 2>&1
          PLAN_RC=$?
          set -e
          if [ "$PLAN_RC" -ne 0 ] && [ "$PLAN_RC" -ne 2 ]; then
            echo "terraform plan check failed for $TEMPLATE_DIR"
            if grep -Eiq "Failed to configure Coder client|Kubernetes cluster unreachable|invalid configuration|no configuration has been provided|connection refused|Failed to load Kubernetes config" /tmp/tf-plan.txt; then
              cat /tmp/tf-plan.txt
              if [ "$TF_PLAN_CHECK_STRICT" = "true" ]; then
                echo "Plan check is strict; failing due to provider connectivity/auth config."
                exit 1
              fi
              echo "Plan check hit provider connectivity/auth limits in CI. Set TF_PLAN_CHECK_STRICT=true to enforce hard fail."
            else
              cat /tmp/tf-plan.txt
              exit 1
            fi
          fi
        )
      done < changed_templates.txt

push_templates:
  stage: push
  image: ghcr.io/coder/coder:latest
  needs:
    - job: discover_templates
      artifacts: true
    - job: validate_templates
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - templates/**/*
        - task-runners/**/*
        - ci/discover_templates.py
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
  script:
    - |
      if [ -z "$CODER_URL" ] || [ -z "$CODER_SESSION_TOKEN" ]; then
        echo "CODER_URL and CODER_SESSION_TOKEN are required to push templates."
        exit 1
      fi
      if [ ! -s changed_templates.txt ]; then
        echo "No changed templates to push."
        exit 0
      fi
      while IFS= read -r TEMPLATE_DIR; do
        [ -z "$TEMPLATE_DIR" ] && continue
        TEMPLATE_NAME="$(sed -n 's/.*"slug"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$TEMPLATE_DIR/metadata.json" 2>/dev/null)"
        [ -z "$TEMPLATE_NAME" ] && TEMPLATE_NAME="$(basename "$TEMPLATE_DIR")"
        echo "Pushing template $TEMPLATE_NAME from $TEMPLATE_DIR"
        coder templates push "$TEMPLATE_NAME" \
          --org "$CODER_ORG" \
          --directory "$TEMPLATE_DIR" \
          --name "$CI_COMMIT_SHORT_SHA" \
          --message "$CI_COMMIT_TITLE" \
          --activate="$AUTO_ACTIVATE" \
          --yes
        # Apply template metadata (icon, display name) if metadata.json exists
        # Note: jq is not available in the coder image, so use grep/sed
        if [ -f "$TEMPLATE_DIR/metadata.json" ]; then
          EDIT_ARGS=""
          ICON="$(sed -n 's/.*"icon"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$TEMPLATE_DIR/metadata.json")"
          DISPLAY_NAME="$(sed -n 's/.*"display_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$TEMPLATE_DIR/metadata.json")"
          [ -n "$ICON" ] && EDIT_ARGS="$EDIT_ARGS --icon $ICON"
          [ -n "$DISPLAY_NAME" ] && EDIT_ARGS="$EDIT_ARGS --display-name \"$DISPLAY_NAME\""
          if [ -n "$EDIT_ARGS" ]; then
            eval coder templates edit "$TEMPLATE_NAME" --org "$CODER_ORG" $EDIT_ARGS --yes
          fi
        fi
      done < changed_templates.txt

check_module_versions:
  stage: check-versions
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  allow_failure: true
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/check-module-versions.sh
