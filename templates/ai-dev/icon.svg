<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Terminal window -->
  <rect x="4" y="8" width="56" height="48" rx="4" fill="#1e1e2e" stroke="#6c7086" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="4" y="8" width="56" height="10" rx="4" fill="#313244"/>
  <rect x="4" y="14" width="56" height="4" fill="#313244"/>
  <circle cx="12" cy="13" r="2" fill="#f38ba8"/>
  <circle cx="19" cy="13" r="2" fill="#f9e2af"/>
  <circle cx="26" cy="13" r="2" fill="#a6e3a1"/>
  <!-- Prompt lines -->
  <text x="10" y="30" font-family="monospace" font-size="7" fill="#89b4fa">$</text>
  <text x="18" y="30" font-family="monospace" font-size="7" fill="#cdd6f4">claude</text>
  <!-- AI sparkle -->
  <path d="M48 28 L50 24 L52 28 L56 30 L52 32 L50 36 L48 32 L44 30 Z" fill="#f5c2e7"/>
